<!DOCTYPE html>
<html>
<head>
<title>The Legend Shreemaan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#050505;
color:white;
text-align:center;
overflow-x:hidden;
}

/* Animated Background */

.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-1;
overflow:hidden;
background:linear-gradient(to bottom,#000000,#061a1f);
}

.bg span{
position:absolute;
display:block;
border-radius:50%;
background:rgba(0,255,255,0.15);
animation:animate 25s linear infinite;
bottom:-150px;
backdrop-filter:blur(5px);
}

.bg span:nth-child(1){
left:10%;
width:80px;
height:80px;
animation-duration:15s;
}

.bg span:nth-child(2){
left:25%;
width:40px;
height:40px;
animation-duration:20s;
}

.bg span:nth-child(3){
left:50%;
width:100px;
height:100px;
animation-duration:18s;
}

.bg span:nth-child(4){
left:70%;
width:60px;
height:60px;
animation-duration:25s;
}

.bg span:nth-child(5){
left:90%;
width:120px;
height:120px;
animation-duration:30s;
}

@keyframes animate{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(-1200px) rotate(720deg);
opacity:0;
}
}

/* Main Card */

.container{
width:90%;
max-width:420px;
margin:auto;
margin-top:40px;
padding:30px;
border-radius:25px;

background:rgba(255,255,255,0.05);

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,0.1);

box-shadow:0 0 30px rgba(0,255,255,0.15);
}

/* DP */

.profile{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid cyan;
box-shadow:0 0 25px cyan;
}

/* Heading */

h1{
margin-top:20px;
font-size:42px;
color:cyan;
text-shadow:0 0 20px cyan;
}

p{
margin-top:10px;
color:#cccccc;
font-size:16px;
}

/* Button */

.btn{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:red;
color:white;
text-decoration:none;
font-size:20px;
border-radius:12px;
font-weight:bold;
transition:0.3s;
box-shadow:0 0 20px rgba(255,0,0,0.5);
}

.btn:hover{
transform:scale(1.08);
background:#ff1a1a;
}

/* Video */

.video{
margin-top:50px;
}

.video h2{
margin-bottom:20px;
font-size:30px;
color:white;
}

.thumb{
width:100%;
border-radius:20px;
transition:0.3s;
box-shadow:0 0 20px rgba(255,255,255,0.1);
}

.thumb:hover{
transform:scale(1.03);
box-shadow:0 0 25px cyan;
}

/* Footer */

.footer{
margin-top:40px;
font-size:14px;
color:gray;
}

</style>
</head>

<body>

<span></span>
