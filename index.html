<!DOCTYPE html>

<title>The Legend Shreemaan</title>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    overflow-x:hidden;
}

/* Animated Background */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
    overflow:hidden;
    top:0;
    left:0;
}

.bg span{
    position:absolute;
    display:block;
    width:20px;
    height:20px;
    background:cyan;
    animation:move 15s linear infinite;
    bottom:-150px;
    border-radius:50%;
    opacity:0.5;
}

.bg span:nth-child(1){
    left:10%;
    width:40px;
    height:40px;
    animation-duration:12s;
}

.bg span:nth-child(2){
    left:30%;
    width:25px;
    height:25px;
    animation-duration:18s;
}

.bg span:nth-child(3){
    left:50%;
    width:50px;
    height:50px;
    animation-duration:10s;
}

.bg span:nth-child(4){
    left:70%;
    width:35px;
    height:35px;
    animation-duration:20s;
}

.bg span:nth-child(5){
    left:90%;
    width:30px;
    height:30px;
    animation-duration:14s;
}

@keyframes move{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0.5;
    }

    100%{
        transform:translateY(-1200px) rotate(720deg);
        opacity:0;
    }
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid cyan;
    object-fit:cover;
    margin-top:30px;
}

h1{
    color:cyan;
    font-size:50px;
}

p{
    color:lightgray;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 30px;
    background:red;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-size:20px;
}

.video{
    margin-top:50px;
}

.thumb{
    width:300px;
    border-radius:15px;
}

</style>
</head>
